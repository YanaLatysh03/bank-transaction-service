services:
  postgres:
    image: postgres:15
    container_name: bank_transaction-postgres
    environment:
      POSTGRES_USER: bank_transaction
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: bank_transaction
    ports:
      - "5432:5432"
    volumes:
      - bank_transaction_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bank_transaction-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_transaction-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Передаем параметры подключения к БД через переменные окружения, которые поймет Spring
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bank_transaction
      - SPRING_DATASOURCE_USERNAME=bank_transaction
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      - postgres

volumes:
  bank_transaction_db_data:
