services:
  postgres:
    image: postgres:15
    container_name: bank_transaction-postgres
    environment:
      POSTGRES_USER: bank_transaction
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: bank_transaction
    ports:
      - "5432:5432"
    volumes:
      - bank_transaction_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bank_transaction-redis
    ports:
      - "6379:6379"

volumes:
  bank_transaction_db_data:
