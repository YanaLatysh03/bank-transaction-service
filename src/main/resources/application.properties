spring.application.name=bank-transaction-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_transaction
spring.datasource.username=bank_transaction
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Redis — кэш курсов поверх PostgreSQL
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

exchange-rate.cache.ttl=24h

# frankfurter
frankfurter.base-url=https://api.frankfurter.dev
frankfurter.connect-timeout=2s
frankfurter.read-timeout=3s
frankfurter.attempts=3
